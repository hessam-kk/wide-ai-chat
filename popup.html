<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 250px; margin: 0; padding: 14px 16px 16px; font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  #pct { font: 600 18px/1 ui-monospace, monospace; }
  #host { margin-top: 2px; font-size: 11px; color: #888; overflow-wrap: anywhere; }
  #range { width: 100%; margin: 12px 0 8px; accent-color: #10a37f; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #note { font-size: 11px; color: #888; }
  label { display: flex; align-items: center; gap: 5px; font-size: 11px; white-space: nowrap;
          cursor: pointer; opacity: .85; }
  label:hover { opacity: 1; }
  #on { margin: 0; accent-color: #10a37f; }
  label:has(#on:disabled) { opacity: .4; cursor: default; }
</style>
<header><strong>Wide Chat</strong><span id="pct">off</span></header>
<div id="host"></div>
<input id="range" type="range" min="60" max="100" step="1" value="90">
<footer><span id="note">Off · tick to enable here</span><label><input id="on" type="checkbox"> On this site</label></footer>
<script src="popup.js"></script>
