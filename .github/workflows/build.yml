name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check
        run: node test.js

      - name: Read the version from manifest.json
        id: version
        run: |
          v=$(node -p 'require("./manifest.json").version')
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v${{ steps.version.outputs.v }}"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest $want - bump manifest.json"
            exit 1
          fi

      - name: Package wide-ai-chat-${{ steps.version.outputs.v }}.zip
        run: |
          mkdir -p dist
          zip -q "dist/wide-ai-chat-${{ steps.version.outputs.v }}.zip" \
            manifest.json content.js popup.html popup.js

      - uses: actions/upload-artifact@v4
        with:
          name: wide-ai-chat-${{ steps.version.outputs.v }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip