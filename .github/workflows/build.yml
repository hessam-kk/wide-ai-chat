name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: # Actions tab can also be run against a tag ref

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check
        run: node test.js

      - name: Read the version from manifest.json
        id: version
        run: echo "v=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Package wide-ai-chat-${{ steps.version.outputs.v }}.zip
        run: |
          mkdir -p dist
          zip -q "dist/wide-ai-chat-${{ steps.version.outputs.v }}.zip" \
            manifest.json content.js popup.html popup.js

      - uses: actions/upload-artifact@v4
        with:
          name: wide-ai-chat-${{ steps.version.outputs.v }}
          path: dist/*.zip
          if-no-files-found: error

      # gh is preinstalled on the runner; it prints the API error instead of
      # swallowing it, which is what a wrapper action does when the token is
      # read-only or the tag does not match the manifest.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v${{ steps.version.outputs.v }}"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest $want - bump manifest.json"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Wide AI Chat $GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber